
<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zvuk Nade - Galerija</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="galerija.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="icon" href="../Images/LogoMini.png">
  <link rel="shortcut icon" href="../Images/LogoMini.png">
</head>
<body>
 
  <!-- Nav -->
  <nav class="navbar" id="navbar">
    <a href="../index.html"><img src="../Images/ZvukNadeLogo.png" class="nav-logo"></a>
    <ul class="nav-links">
      <li><a href="../index.html" class="nav-btn">Glavna Stranica</a></li>
      <li><a href="galerija.html" class="nav-btn active">Galerija</a></li>
      <li><a href="donacije.html" class="nav-btn">Donacije</a></li>
    </ul>
    <div class="hamburger" id="hamburger">
      <span></span><span></span><span></span>
    </div>
  </nav>
 
  <!-- Mobilni Meni -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="../index.html" class="nav-btn">Glavna Stranica</a>
    <a href="galerija.html" class="nav-btn">Galerija</a>
    <a href="donacije.html" class="nav-btn">Donacije</a>
  </div>
 
  <!-- Video -->
  <section class="video-section">
    <iframe
      class="hero-video"
      src="../Images/CharlityVideo.mp4"
      id="heroVideo"
      title="Hero video"
      frameborder="0"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </section>
 
  <!-- Glavni content -->
  <main class="container">
 
    <!-- Obaveštenje -->
    <section class="text-section reveal">
      <div class="text-block">
        <h3 class="sub-title">Obaveštenje!</h3>
        <p>
          Trenutno nemamo slike sa humanitarnih svirki, navratite malo kasnije ❤️!
        </p>
        <a href="../index.html" class="nav-btn" style="display:inline-block; margin-top:12px;">→ Vratite se na glavnu stranicu ←</a>
      </div>
    </section>
 
    <!-- ===== SVIRKA 1 =====
         Kada dobiješ slike, ukloni stil display:none sa ove sekcije
         i zameni src u img tagovima sa pravim slikama -->
    <section class="person-section reveal" id="svirka1-section">
      <div class="person-card slider-card">
 
        <div class="slider-header">
          <h3 class="slider-title">Svirka 1</h3>
        </div>
 
        <div class="slider-body">
 
          <!-- Glavna slika + strelice -->
          <div class="slider-main">
            <button class="slider-arrow left" onclick="changeSlide('svirka1', -1)">&#8249;</button>
            <img src="../Images/Sofija1.jpg" class="slider-big-img" id="svirka1-main" src="" alt="Svirka 1">
            <button class="slider-arrow right" onclick="changeSlide('svirka1', 1)">&#8250;</button>
          </div>
 
          <!-- Thumbnails -->
          <div class="slider-thumbs" id="svirka1-thumbs">
            <img src="../Images/Sofija1.jpg" class="thumb active" onclick="setSlide('svirka1', 0)" alt="0"/>
            <img src="../Images/Sofija2.jpg" class="thumb"        onclick="setSlide('svirka1', 1)" alt="1"/>
            <img src="../Images/Sofija1.jpg" class="thumb" onclick="setSlide('svirka1', 2)" alt="2"/>
            <img src="../Images/Sofija1.jpg" class="thumb" onclick="setSlide('svirka1', 3)" alt="3"/>
            <img src="../Images/Sofija1.jpg" class="thumb" onclick="setSlide('svirka1', 4)" alt="4"/>
            <img src="../Images/Sofija1.jpg" class="thumb" onclick="setSlide('svirka1', 5)" alt="5"/>
            <img src="../Images/Sofija2.jpg" class="thumb"        onclick="setSlide('svirka1', 6)" alt="6"/>
            <img src="../Images/Sofija1.jpg" class="thumb" onclick="setSlide('svirka1', 7)" alt="7"/>
            <img src="../Images/Sofija1.jpg" class="thumb" onclick="setSlide('svirka1', 8)" alt="8"/>
            <img src="../Images/Sofija1.jpg" class="thumb" onclick="setSlide('svirka1', 9)" alt="9"/>
            <img src="../Images/Sofija1.jpg" class="thumb" onclick="setSlide('svirka1', 10)" alt="10"/>                          
          </div>
 
        </div>
      </div>
    </section>
 
  </main>
 
  <!-- FOOTER -->
  <footer class="footer">
    <section class="Links">
      <a target="_blank" href="https://www.instagram.com/zvuk.nade?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==">Instagram</a>
      <a target="_blank" href="https://www.tiktok.com/@zvuk.nade?is_from_webapp=1&sender_device=pc">TikTok</a>
      <div class="credits">
        <p>© 2026 Zvuk Nade. Sva prava zadržana.</p>
        <p>Uređivač sajt: @minjix.design</p>
      </div>
    </section>  
  </footer>
 
  <script src="script.js"></script>
  <script src="galerija.js"></script>
</body>
</html>
